<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle Tech IA — L'actualité et l'analyse de l'Intelligence Artificielle</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030712;
            --card-bg: rgba(10, 25, 47, 0.7);
            --neon-cyan: #00f0ff;
            --electric-blue: #0088ff;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-glow: rgba(0, 240, 255, 0.25);
        }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
            line-height: 1.6;
        }
        header {
            text-align: center;
            margin-bottom: 50px;
        }
        h1, h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0,240,255,0.3);
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .subtitle { color: var(--text-muted); font-size: 1.1rem; }
        
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-glow);
            padding-bottom: 10px;
        }

        /* Conteneur des cartes d'articles générées automatiquement */
        .latest-grid {
            display: grid;
            gap: 20px;
            margin-bottom: 40px;
        }
        .article-preview-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,240,255,0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .article-preview-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(0,240,255,0.2);
        }
        .article-preview-card h3 {
            margin: 10px 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
        }
        .article-preview-card h3 a {
            color: var(--text-main);
            text-decoration: none;
        }
        .article-preview-card h3 a:hover {
            color: var(--neon-cyan);
        }
        .article-tag {
            color: var(--neon-cyan);
            font-size: 0.8rem;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }
        .article-date {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-family: 'Orbitron', sans-serif;
            display: block;
            margin-top: 15px;
        }
        .archives-link-container {
            text-align: center;
            margin-top: 40px;
        }
        .btn-archives {
            display: inline-block;
            background: transparent;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 12px 25px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            text-decoration: none;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .btn-archives:hover {
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 10px var(--neon-cyan);
        }
    </style>
</head>
<body>

    <header>
        <h1>Nouvelle Tech IA</h1>
        <p class="subtitle">Analyses, réflexions et décryptages sur l'intelligence artificielle au quotidien</p>
    </header>

    <main>
        <h2 class="section-title">Dernières Publications</h2>
        
        <!-- C'est ici que le JavaScript va injecter tes articles récents automatiquement -->
        <div class="latest-grid" id="homeArticlesGrid"></div>

        <div class="archives-link-container">
            <a href="archives.html" class="btn-archives">Voir toutes les archives &rarr;</a>
        </div>
    </main>

    <script>
        // LA LISTE CENTRALE DE TES ARTICLES
        // (Tu ajoutes simplement ton nouvel article tout en haut de cette liste à chaque fois)
        const listeGlobaleArticles = [
            {
                titre: "La course à l'autonomie des smartphones : quand l'IA devient agentique",
                date: "30 Septembre 2026",
                url: "article-4.html",
                tag: "SMARTPHONES & IA",
                extrait: "L'émergence de l'IA agentique transforme notre smartphone en véritable assistant autonome capable d'agir en arrière-plan."
            },
            {
                titre: "Titre de ton Article 3",
                date: "Date de l'article 3",
                url: "article-3.html",
                tag: "AUTRE TAG",
                extrait: "Court résumé ou aperçu de l'article 3..."
            },
            {
                titre: "Titre de ton Article 2",
                date: "Date de l'article 2",
                url: "article-2.html",
                tag: "AUTRE TAG",
                extrait: "Court résumé ou aperçu de l'article 2..."
            },
            {
                titre: "Titre de ton Article 1",
                date: "Date de l'article 1",
                url: "article-1.html",
                tag: "PREMIER TAG",
                extrait: "Court résumé ou aperçu de l'article 1..."
            }
        ];

        // Injection automatique des 3 articles les plus récents sur la page d'accueil
        const gridContainer = document.getElementById('homeArticlesGrid');
        
        // .slice(0, 3) permet d'afficher uniquement les 3 premiers articles de la liste sur l'accueil
        listeGlobaleArticles.slice(0, 3).forEach(art => {
            const card = document.createElement('div');
            card.className = 'article-preview-card';
            card.innerHTML = `
                <span class="article-tag">${art.tag}</span>
                <h3><a href="${art.url}">${art.titre}</a></h3>
                <p style="color:var(--text-muted); font-size:0.95rem; margin-top:8px;">${art.extrait}</p>
                <span class="article-date">${art.date}</span>
            `;
            gridContainer.appendChild(card);
        });
    </script>

</body>
</html>
