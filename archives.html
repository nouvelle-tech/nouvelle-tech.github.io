<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archives — Nouvelle Tech IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030712;
            --card-bg: rgba(10, 25, 47, 0.7);
            --neon-cyan: #00f0ff;
            --electric-blue: #0088ff;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-glow: rgba(0, 240, 255, 0.25);
        }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-cyan);
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(0,240,255,0.3);
        }
        .archive-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .archive-item {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }
        .archive-item:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0,240,255,0.2);
        }
        .archive-info h3 a {
            color: #fff;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
        }
        .archive-info h3 a:hover {
            color: var(--neon-cyan);
        }
        .archive-date {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .back-home {
            display: inline-block;
            margin-top: 30px;
            color: var(--neon-cyan);
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
        }
    </style>
</head>
<body>

    <h1>Archives des Publications</h1>
    
    <!-- C'est ici que la liste va se remplir toute seule ! -->
    <div class="archive-list" id="archiveContainer">
        <!-- Généré automatiquement par le script ci-dessous -->
    </div>

    <a href="index.html" class="back-home">&larr; Retour à l'accueil</a>

    <script>
        // LA LISTE MAGIQUE : À chaque nouvel article, tu l'ajoutes simplement ici tout en haut !
        const tousLesArticles = [
            {
                titre: "Les JO des robots : quand la science-fiction devient notre réalité",
                date: "22 Septembre 2026",
                url: "article-3.html",
                tag: "ROBOTIQUE"
            },
            {
                titre: "ChatGPT et nos ados : un outil formidable, mais la sécurité avant tout",
                date: "Septembre 2026",
                url: "article-2.html",
                tag: "ÉTHIQUE"
            },
            {
                titre: "L'IA au quotidien : un coup de pouce indispensable",
                date: "Septembre 2026",
                url: "article-1.html",
                tag: "IA"
            }
        ];

        const container = document.getElementById('archiveContainer');

        // Le script crée les blocs tout seul comme un grand
        tousLesArticles.forEach(article => {
            const item = document.createElement('div');
            item.className = 'archive-item';
            item.innerHTML = `
                <div class="archive-info">
                    <span style="font-size:0.75rem; color:var(--neon-cyan); font-family:'Orbitron';">${article.tag}</span>
                    <h3><a href="${article.url}">${article.titre}</a></h3>
                </div>
                <div class="archive-date">${article.date}</div>
            `;
            container.appendChild(item);
        });
    </script>

</body>
</html>
