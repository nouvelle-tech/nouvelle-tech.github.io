<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archives & Tous les Articles — Nouvelle Tech IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030712;
            --card-bg: rgba(10, 25, 47, 0.7);
            --electric-blue: #0088ff;
            --neon-cyan: #00f0ff;
            --glow-blue: rgba(0, 136, 255, 0.4);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-glow: rgba(0, 240, 255, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Rajdhani', sans-serif; line-height: 1.6; min-height: 100vh; }
        
        header {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
            padding: 30px 10%; border-bottom: 1px solid var(--border-glow); backdrop-filter: blur(12px); position: relative; z-index: 100;
        }

        .menu-container { position: absolute; top: 25px; left: 30px; }
        .burger-btn {
            background: var(--card-bg); border: 1px solid var(--border-glow); border-radius: 8px;
            width: 45px; height: 45px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
        }
        .burger-line { width: 22px; height: 2px; background-color: var(--neon-cyan); box-shadow: 0 0 5px var(--neon-cyan); }
        .menu-dropdown {
            position: absolute; top: 55px; left: 0; background: rgba(3, 7, 18, 0.95);
            border: 1px solid var(--border-glow); border-radius: 8px; width: 200px; padding: 10px 0; display: none; z-index: 1000;
        }
        .menu-dropdown.active { display: block; }
        .menu-dropdown a { display: block; padding: 10px 20px; color: var(--text-main); text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 0.85rem; }
        .menu-dropdown a:hover { background: rgba(0, 136, 255, 0.2); color: var(--neon-cyan); }

        .logo-container { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-text { font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 800; color: #fff; text-shadow: 0 0 12px var(--electric-blue), 0 0 25px var(--neon-cyan); letter-spacing: 3px; }

        .main-container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }

        /* Barre supérieure (Retour accueil + Titre) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .section-title { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; color: #fff; }

        .btn-back-top {
            display: inline-flex; align-items: center; gap: 8px; font-family: 'Orbitron', sans-serif; font-size: 0.85rem; font-weight: 600;
            color: var(--neon-cyan); background: var(--card-bg); border: 1px solid var(--neon-cyan); padding: 10px 20px; border-radius: 8px; text-decoration: none;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.15); transition: all 0.3s ease;
        }
        .btn-back-top:hover { background: rgba(0, 240, 255, 0.15); box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); transform: translateY(-2px); color: #fff; }

        /* Barre de recherche et filtres */
        .search-filter-container {
            display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px; background: var(--card-bg); border: 1px solid var(--border-glow); padding: 25px; border-radius: 12px; backdrop-filter: blur(8px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .search-input {
            width: 100%; background: rgba(3, 7, 18, 0.8); border: 1px solid var(--border-glow);
            padding: 14px 20px; border-radius: 8px; color: #fff; font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; outline: none;
            transition: 0.3s;
        }
        .search-input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }

        .tags-filters { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .filter-btn {
            font-family: 'Orbitron', sans-serif; font-size: 0.75rem; color: var(--text-muted); background: rgba(3, 7, 18, 0.6);
            border: 1px solid var(--border-glow); padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: 0.3s;
        }
        .filter-btn:hover, .filter-btn.active { color: var(--neon-cyan); border-color: var(--neon-cyan); background: rgba(0, 136, 255, 0.2); box-shadow: 0 0 10px var(--glow-blue); }

        /* Grille d'articles */
        .articles-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; margin-bottom: 40px; }
        
        .article-card {
            background: var(--card-bg); border: 1px solid rgba(0, 240, 255, 0.15); border-radius: 10px; padding: 28px;
            transition: all 0.3s ease; display: flex; flex-direction: column; justify-content: space-between; backdrop-filter: blur(6px);
        }
        .article-card:hover { transform: translateY(-7px); border-color: var(--neon-cyan); box-shadow: 0 0 25px rgba(0, 136, 255, 0.3); }

        .tag {
            align-self: flex-start; font-family: 'Orbitron', sans-serif; font-size: 0.75rem; color: var(--neon-cyan);
            background: rgba(0, 136, 255, 0.15); border: 1px solid var(--electric-blue); padding: 3px 10px; border-radius: 4px; margin-bottom: 18px;
        }
        .article-card h2 { font-size: 1.4rem; color: #fff; margin-bottom: 12px; font-weight: 600; }
        .article-card h2 a { color: #fff; text-decoration: none; transition: color 0.2s; }
        .article-card h2 a:hover { color: var(--neon-cyan); }
        .article-card p { color: var(--text-muted); font-size: 1.05rem; margin-bottom: 22px; }
        
        .article-footer-info { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; border-top: 1px solid rgba(0,240,255,0.1); padding-top: 15px; }
        .article-date { font-size: 0.85rem; color: var(--text-muted); font-family: 'Orbitron', sans-serif; }
        
        .read-more { text-decoration: none; color: var(--neon-cyan); font-weight: 700; font-family: 'Orbitron', sans-serif; font-size: 0.9rem; }
        .read-more:hover { text-shadow: 0 0 10px var(--neon-cyan); }

        footer { text-align: center; padding: 40px 0; border-top: 1px solid rgba(0, 240, 255, 0.1); color: var(--text-muted); margin-top: 40px; font-size: 0.95rem; }
    </style>
</head>
<body>

    <header>
        <div class="menu-container">
            <div class="burger-btn" onclick="toggleMenu()" title="Menu">
                <div class="burger-line"></div>
                <div class="burger-line"></div>
                <div class="burger-line"></div>
            </div>
            <div class="menu-dropdown" id="menuDropdown">
                <a href="index.html">Accueil</a>
                <a href="archives.html">Archives</a>
                <a href="bio.html">À propos & Bio</a>
            </div>
        </div>
        <a href="index.html" class="logo-container">
            <span class="logo-text">NOUVELLE TECH IA</span>
        </a>
    </header>

    <div class="main-container">
        <!-- Barre supérieure avec titre et bouton retour accueil -->
        <div class="top-bar">
            <h1 class="section-title">Archives & Publications</h1>
            <a href="index.html" class="btn-back-top">&larr; Retour à l'accueil</a>
        </div>

        <!-- Barre de recherche et filtres bien mis en avant -->
        <div class="search-filter-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Rechercher un article par mot-clé..." onkeyup="filterArticles()">
            <div class="tags-filters" id="tagsFilters">
                <button class="filter-btn active" onclick="filterByTag('Tous')">Tous</button>
            </div>
        </div>

        <!-- Grille injectée dynamiquement -->
        <div class="articles-grid" id="archivesGrid"></div>
    </div>

    <footer>
        <p>&copy; 2026 Nouvelle tech IA — Propulsion Blue-Tech & GitHub Pages</p>
    </footer>

    <!-- Script de gestion dynamique, recherche et filtres -->
    <script src="articles.js"></script>
